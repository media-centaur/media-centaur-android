# The TV's remote in mpv. The app sends the remote's keys as `keypress` with
# these names while a file plays (RemoteKeys.kt); a visible pill's forced
# ENTER binding wins while it shows. mpv's defaults are off
# (input-default-bindings=no), so nothing here is inherited.
ENTER cycle pause
SPACE cycle pause
PLAYPAUSE cycle pause
PLAY set pause no
PAUSE set pause yes
LEFT seek -10
RIGHT seek 10
UP seek 60
DOWN seek -60
FORWARD seek 30
REWIND seek -30
MENU script-binding media_centaur/track-menu
