name: Release

# A release is a tag. Push `v<versionName>` and this job builds the signed
# universal APK, checks its name against the tag, and publishes it with a
# checksum and the CHANGELOG's notes. Nothing is built or uploaded by hand.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Signed APK and GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the build's versionName matches the tag
        run: |
          name=$(grep -E '^val appVersionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$name" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match appVersionName ($name)"
            exit 1
          fi

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Toolchain from mise.toml
        uses: jdx/mise-action@v5

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the release keystore from secrets
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "${{ secrets.MC_ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$keystore"
          echo "MC_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          MC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MC_ANDROID_KEYSTORE_PASSWORD }}
          MC_ANDROID_KEY_ALIAS: ${{ secrets.MC_ANDROID_KEY_ALIAS }}
          MC_ANDROID_KEY_PASSWORD: ${{ secrets.MC_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage the artifact and its checksum
        run: |
          version="${{ steps.version.outputs.version }}"
          src="app/build/outputs/apk/release/media-centaur-tv-${version}-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::Expected APK not found at $src"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          mkdir -p artifacts
          cp "$src" artifacts/
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v tag="$tag" '
            $0 ~ "^## " tag " " { in_section=1; next }
            in_section && /^## v[0-9]/ { exit }
            in_section { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          fi
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          cat "$notes"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* \
              --title "Media Centaur TV $tag" \
              --notes-file "$NOTES_FILE"
          fi
